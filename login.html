<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Sign in</title>
</head>

<body>

    <header>
        <nav class="haut">
            <h2>Sign in</h2>
        </nav>
    </header>

    <main>

        <div class="gris">

            <div class="user">
                <img src="user.png" alt="User" class="icon">
            </div>

            <div class="message">
                <p id="bon">Welcome !</p>
                <p id="pard">Please sign in to access content !</p>
            </div>

        </div>

        <div class="test">

            <input
                type="text"
                placeholder="Username"
            >

            <input
                type="password"
                placeholder="Password"
            >

            <button type="submit">
                Sign in
            </button>

        </div>

    </main>

    <footer>
        All rights reserved Irie Ange
    </footer>

</body>

</html>
