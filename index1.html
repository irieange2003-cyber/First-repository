<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style1.css">

    <title>Ad List</title>
</head>

<body>

    <div class="page">

        <!-- HEADER -->
        <header class="header">
            <h1>Ad List</h1>

        <main class="main">

            <nav class="tabs">

            <!-- LISTE DES ANNONCES -->
            <section class="ads">

                <article class="ad">

                    <img

                        <div>

                        </div>

                        </div>

                    </div>

                </article>


                <!-- ANNONCE 2 -->
                <article class="ad">

                    <img

                    >

                    <div class="ad-content">

                        <div>
                            <h2>Title</h2>
                            <p>Description</p>
                        </div>

                        <div class="ad-bottom">
                            <span>1 hour ago</span>
                            <strong>$99,00</strong>
                        </div>

                    </div>

                </article>

            </section>

        </main>


        <!-- FOOTER -->
